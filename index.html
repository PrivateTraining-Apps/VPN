<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPN Packet Animation</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --ink: #1d2330; --quiet: #5d6676; --line: #c9ced8;
    --node: #ffffff; --accent: #2f6fdb; --accent-soft: rgba(47,111,219,0.13);
    --danger: #c9372c; --danger-soft: rgba(201,55,44,0.10); --good: #1f8a4c;
    --seg-ip: #e7ecf5; --seg-tcp: #e9f1e6; --seg-data: #fbefd9; --seg-enc: #2f6fdb; --seg-hdr: #d6dcea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --ink: #e6e9ef; --quiet: #9aa3b2; --line: #3a404c;
      --node: #232833; --accent: #6b9cf0; --accent-soft: rgba(107,156,240,0.16);
      --danger: #ef6a5e; --danger-soft: rgba(239,106,94,0.14); --good: #4cc07e;
      --seg-ip: #2c3444; --seg-tcp: #2b3a2f; --seg-data: #4a3d24; --seg-enc: #4d7fd6; --seg-hdr: #394257;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 960px; height: 460px; margin: 0 auto; padding: 10px 16px;
    display: flex; flex-direction: column; gap: 8px; }
  .stage { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; display: flex; }
  svg { width: 100%; height: 100%; display: block; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button, select { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 84px; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count { font-size: 13px; color: var(--quiet); margin-left: auto; }
  .caption { min-height: 44px; font-size: 14px; line-height: 1.4; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .caption b { color: var(--accent); }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, Consolas, "Courier New", monospace; }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <svg id="svg" viewBox="0 0 960 392" role="img" aria-label="Animation comparing a packet sent without a VPN and with a VPN">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0L10 5L0 10z" fill="var(--line)"/>
        </marker>
      </defs>
      <g id="scene"></g>
    </svg>
  </div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="bar">
    <button class="primary" id="play">Play</button>
    <button id="step">Step</button>
    <button id="reset">Reset</button>
    <label style="font-size:14px;color:var(--quiet)">Speed
      <select id="speed">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
      </select>
    </label>
    <span class="count" id="count"></span>
  </div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const scene = document.getElementById('scene');
  const el = (tag, attrs = {}, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    return n;
  };

  // Layout
  const X = { laptop: 80, wifi: 280, internet: 480, gateway: 680, server: 870 };
  const LANE = { A: 120, B: 300 };
  const PKT_DY = -52;

  const hex = () => Array.from({ length: 4 }, () =>
    Math.floor(Math.random() * 65536).toString(16).padStart(4, '0')).join(' ');
  let cipher = hex();

  // Static scene
  const nodes = {};
  const captures = {};
  function drawLane(lane, title, hasGateway) {
    const y = LANE[lane];
    scene.appendChild(el('text', { x: 20, y: y - 92, 'font-size': 15, 'font-weight': 600, fill: 'var(--ink)' }, title));
    const list = hasGateway
      ? ['laptop', 'wifi', 'internet', 'gateway', 'server']
      : ['laptop', 'wifi', 'internet', 'server'];
    if (hasGateway) {
      scene.appendChild(el('rect', { x: X.laptop - 60, y: y - 30, width: X.gateway + 60 - (X.laptop - 60), height: 60,
        rx: 12, fill: 'var(--accent-soft)', stroke: 'var(--accent)', 'stroke-width': 1.5, 'stroke-dasharray': '6 4' }));
      scene.appendChild(el('text', { x: (X.wifi + X.internet) / 2, y: y + 25, 'text-anchor': 'middle', 'font-size': 11.5,
        'font-weight': 600, fill: 'var(--accent)' }, 'Encrypted tunnel'));
    }
    for (let i = 0; i < list.length - 1; i++) {
      scene.appendChild(el('line', { x1: X[list[i]] + 52, y1: y, x2: X[list[i + 1]] - 54, y2: y,
        stroke: 'var(--line)', 'stroke-width': 1.5, 'marker-end': 'url(#arr)' }));
    }
    const labels = { laptop: 'Laptop', wifi: 'Café Wi-Fi', internet: 'Internet', gateway: 'VPN gateway', server: 'Office server' };
    for (const k of list) {
      const g = el('g');
      const r = el('rect', { x: X[k] - 52, y: y - 20, width: 104, height: 40, rx: 8,
        fill: 'var(--node)', stroke: 'var(--line)', 'stroke-width': 1.25 });
      g.appendChild(r);
      g.appendChild(el('text', { x: X[k], y: y + 5, 'text-anchor': 'middle', 'font-size': 13,
        'font-weight': k === 'gateway' ? 600 : 400, fill: 'var(--ink)' }, labels[k]));
      scene.appendChild(g);
      nodes[lane + k] = r;
    }
    // Eavesdropper and capture panel
    const ey = y + 52;
    const eye = el('g');
    eye.appendChild(el('circle', { cx: X.wifi - 66, cy: ey, r: 13, fill: 'var(--danger-soft)', stroke: 'var(--danger)', 'stroke-width': 1.25 }));
    eye.appendChild(el('text', { x: X.wifi - 66, y: ey + 4, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: 'var(--danger)' }, 'E'));
    eye.appendChild(el('line', { x1: X.wifi - 66, y1: ey - 13, x2: X.wifi - 20, y2: y + 20, stroke: 'var(--danger)',
      'stroke-width': 1, 'stroke-dasharray': '3 3' }));
    scene.appendChild(eye);
    const box = el('rect', { x: X.wifi - 46, y: ey - 15, width: 600, height: 30, rx: 6,
      fill: 'var(--panel)', stroke: 'var(--line)', 'stroke-width': 1 });
    scene.appendChild(box);
    const label = el('text', { x: X.wifi - 36, y: ey + 4, 'font-size': 12, fill: 'var(--quiet)', class: 'mono' }, '');
    scene.appendChild(label);
    captures[lane] = { box, label };
  }
  drawLane('A', 'Without a VPN', false);
  drawLane('B', 'With a VPN', true);

  // Packets
  const packets = {};
  for (const lane of ['A', 'B']) {
    const g = el('g');
    scene.appendChild(g);
    packets[lane] = { g, form: null };
  }

  const FORMS = {
    plain: [
      { w: 52, fill: 'var(--seg-ip)', t: 'IP', s: 'to server' },
      { w: 42, fill: 'var(--seg-tcp)', t: 'TCP', s: '443' },
      { w: 128, fill: 'var(--seg-data)', t: 'DATA', s: 'user=sam pass=Summer26' }
    ],
    enc: () => [
      { w: 222, fill: 'var(--seg-enc)', t: 'ENCRYPTED', s: cipher, light: true }
    ],
    wrap: () => [
      { w: 56, fill: 'var(--seg-hdr)', t: 'NEW IP', s: 'to gateway' },
      { w: 36, fill: 'var(--seg-hdr)', t: 'VPN', s: 'seq' },
      { w: 150, fill: 'var(--seg-enc)', t: 'ENCRYPTED', s: cipher.slice(0, 14), light: true },
      { w: 38, fill: 'var(--seg-hdr)', t: 'ICV', s: 'check' }
    ]
  };

  function buildPacket(lane, form) {
    const p = packets[lane];
    if (p.form === form) return;
    p.form = form;
    p.g.replaceChildren();
    const segs = typeof FORMS[form] === 'function' ? FORMS[form]() : FORMS[form];
    const total = segs.reduce((a, s) => a + s.w, 0);
    let x = -total / 2;
    for (const s of segs) {
      p.g.appendChild(el('rect', { x, y: -17, width: s.w, height: 34, rx: 4, fill: s.fill,
        stroke: 'var(--line)', 'stroke-width': 1 }));
      p.g.appendChild(el('text', { x: x + s.w / 2, y: -3, 'text-anchor': 'middle', 'font-size': 9.5,
        'font-weight': 700, fill: s.light ? '#fff' : 'var(--ink)' }, s.t));
      p.g.appendChild(el('text', { x: x + s.w / 2, y: 10, 'text-anchor': 'middle', 'font-size': 9,
        fill: s.light ? '#fff' : 'var(--quiet)', class: 'mono' }, s.s));
      x += s.w;
    }
  }

  const CAP = {
    A: 'Captured: 192.168.1.23 > 203.0.113.50  POST /login  user=sam pass=Summer26',
    B: () => `Captured: 192.168.1.23 > 198.51.100.1 (gateway)  ESP  ${cipher} ...`
  };

  // Steps: each lane may define x:[from,to], form, op:[from,to]; plus capture and highlight.
  const steps = [
    { dur: 1600, text: '<b>Step 1.</b> Both laptops build the same packet: a login request to the office server. It holds a username and password.',
      A: { x: [X.laptop, X.laptop], form: 'plain', op: [0, 1] }, B: { x: [X.laptop, X.laptop], form: 'plain', op: [0, 1] }, hi: ['Alaptop', 'Blaptop'] },
    { dur: 1800, text: '<b>Step 2.</b> The VPN client encrypts the <i>entire</i> original packet, including its IP header. The laptop without a VPN does nothing extra.',
      B: { formAt: [0.45, 'enc'] }, hi: ['Blaptop'] },
    { dur: 1800, text: '<b>Step 3.</b> Encapsulation: the client adds a VPN header, an integrity check value (ICV) and a new outer IP header addressed to the VPN gateway.',
      B: { formAt: [0.45, 'wrap'] }, hi: ['Blaptop'] },
    { dur: 1700, text: '<b>Step 4.</b> Both packets travel across the café Wi-Fi, which neither user controls.',
      A: { x: [X.laptop, X.wifi] }, B: { x: [X.laptop, X.wifi] }, hi: ['Awifi', 'Bwifi'] },
    { dur: 2400, text: '<b>Step 5.</b> An eavesdropper on the Wi-Fi captures both packets. Without a VPN the password is readable. With a VPN they see only the gateway address and ciphertext.',
      capture: true, hi: ['Awifi', 'Bwifi'] },
    { dur: 2000, text: '<b>Step 6.</b> Internet routers forward each packet using only its outer IP header. The VPN packet heads to the gateway, not the server.',
      A: { x: [X.wifi, X.internet] }, B: { x: [X.wifi, X.gateway] }, hi: ['Ainternet', 'Binternet', 'Bgateway'] },
    { dur: 2000, text: '<b>Step 7.</b> The gateway checks the ICV (any tampering means the packet is dropped), removes the outer headers and decrypts the original packet.',
      A: { x: [X.internet, X.server] }, B: { formAt: [0.5, 'plain'] }, hi: ['Bgateway', 'Aserver'] },
    { dur: 1700, text: '<b>Step 8.</b> The original packet is forwarded on the trusted internal network. Both logins arrived, but only one stayed private on the way.',
      B: { x: [X.gateway, X.server] }, hi: ['Aserver', 'Bserver'] }
  ];

  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function initial() {
    return { A: { x: X.laptop, form: 'plain', op: 0 }, B: { x: X.laptop, form: 'plain', op: 0 }, capture: 0, hi: [] };
  }
  function apply(step, s, p) {
    for (const lane of ['A', 'B']) {
      const c = step[lane];
      if (!c) continue;
      if (c.x) s[lane].x = c.x[0] + (c.x[1] - c.x[0]) * ease(p);
      if (c.form) s[lane].form = c.form;
      if (c.op) s[lane].op = c.op[0] + (c.op[1] - c.op[0]) * p;
      if (c.formAt && p >= c.formAt[0]) s[lane].form = c.formAt[1];
      s[lane].pulse = c.formAt ? Math.max(0, 1 - Math.abs(p - c.formAt[0]) * 5) : 0;
    }
    if (step.capture) s.capture = Math.min(1, p * 1.6);
    s.hi = step.hi || [];
  }
  function stateAt(i, p) {
    const s = initial();
    for (let k = 0; k < i; k++) apply(steps[k], s, 1);
    if (i < steps.length) apply(steps[i], s, p);
    return s;
  }

  function render(s, i) {
    for (const lane of ['A', 'B']) {
      buildPacket(lane, s[lane].form);
      const sc = 1 + 0.12 * (s[lane].pulse || 0);
      packets[lane].g.setAttribute('transform', `translate(${s[lane].x},${LANE[lane] + PKT_DY}) scale(${sc})`);
      packets[lane].g.setAttribute('opacity', s[lane].op);
    }
    for (const k in nodes) {
      const on = s.hi.includes(k);
      nodes[k].setAttribute('stroke', on ? 'var(--accent)' : 'var(--line)');
      nodes[k].setAttribute('stroke-width', on ? 2.25 : 1.25);
    }
    if (s.capture > 0) {
      const a = CAP.A, b = CAP.B();
      captures.A.label.textContent = a.slice(0, Math.ceil(a.length * s.capture));
      captures.B.label.textContent = b.slice(0, Math.ceil(b.length * s.capture));
      captures.A.label.setAttribute('fill', 'var(--danger)');
      captures.B.label.setAttribute('fill', 'var(--accent)');
      captures.A.box.setAttribute('stroke', 'var(--danger)');
      captures.A.box.setAttribute('fill', 'var(--danger-soft)');
      captures.B.box.setAttribute('stroke', 'var(--accent)');
    } else {
      for (const lane of ['A', 'B']) {
        captures[lane].label.textContent = 'Eavesdropper listening on the Wi-Fi...';
        captures[lane].label.setAttribute('fill', 'var(--quiet)');
        captures[lane].box.setAttribute('stroke', 'var(--line)');
        captures[lane].box.setAttribute('fill', 'var(--panel)');
      }
    }
    const idx = Math.min(i, steps.length - 1);
    document.getElementById('caption').innerHTML = steps[idx].text;
    document.getElementById('count').textContent = `Step ${idx + 1} of ${steps.length}`;
  }

  // Playback
  let idx = 0, prog = 0, playing = false, last = 0;
  const playBtn = document.getElementById('play');
  const speedSel = document.getElementById('speed');

  function frame(ts) {
    if (!playing) return;
    const dt = last ? ts - last : 0;
    last = ts;
    prog += (dt * Number(speedSel.value)) / steps[idx].dur;
    if (prog >= 1) {
      if (idx < steps.length - 1) { idx++; prog = 0; }
      else { prog = 1; setPlaying(false); }
    }
    render(stateAt(idx, prog), idx);
    if (playing) requestAnimationFrame(frame);
  }
  function setPlaying(v) {
    playing = v;
    playBtn.textContent = v ? 'Pause' : (idx === steps.length - 1 && prog >= 1 ? 'Replay' : 'Play');
    if (v) { last = 0; requestAnimationFrame(frame); }
  }
  playBtn.addEventListener('click', () => {
    if (!playing && idx === steps.length - 1 && prog >= 1) reset();
    setPlaying(!playing);
  });
  document.getElementById('step').addEventListener('click', () => {
    setPlaying(false);
    if (prog >= 1 && idx < steps.length - 1) { idx++; prog = 0; }
    prog = 1;
    render(stateAt(idx, 1), idx);
    playBtn.textContent = idx === steps.length - 1 ? 'Replay' : 'Play';
  });
  function reset() {
    setPlaying(false);
    idx = 0; prog = 0; cipher = hex();
    packets.A.form = packets.B.form = null;
    render(stateAt(0, 0), 0);
    playBtn.textContent = 'Play';
  }
  document.getElementById('reset').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
